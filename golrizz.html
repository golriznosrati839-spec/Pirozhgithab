<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درگاه پرداخت</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .payment-form {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 600px;
            height: 350px;
        }
        .payment-form h2 {
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            margin-left: 10px;
        }
        .form-group input {
            width: 380px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            left: 10px;
        }
        .form-group input:focus {
            border-color: #007bff;
        }
        .form-group.small-group {
            display: flex;
            justify-content: space-between;
        }
        .form-group.small-group input {
            width: 48%;
        }
        .submit-btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="payment-form">
        <h2>درگاه پرداخت</h2>
        <div class="form-group">
            <label for="card-number">شماره کارت</label>
            <input type="text" id="card-number" maxlength="16" placeholder="**** **** **** ****">
        </div>
        <div class="form-group">
            <label for="otp">رمز پویا</label>
            <input type="text" id="otp" maxlength="6" placeholder="******">
        </div>
        <div class="form-group small-group">
            <div>
                <label for="expiry-date">تاریخ انقضا</label>
                <input type="text" id="expiry-date" placeholder="MM/YY">
            </div>
            <div>
                <label for="cvv2">CVV2</label>
                <input type="text" id="cvv2" maxlength="4" placeholder="****">
            </div>
        </div>
     
        <button class="submit-btn">پرداخت</button>
    </div>
</body>
</html>
